[tool.poetry]
name = "hmcollab"
version = "0.3.0"
description = "Example marketing ML project"
authors = ["Reuben Brasher and Georgina Gonzalez"]
license = "MIT"
readme = "README.md"
packages = [{include = "hmcollab"}]
include = ["README.md", "hmcollab/tests/testdata/*"]

[tool.poetry.dependencies]
python = "^3.11"
numpy = "^1.24"
pandas = "^1.4"
scikit-learn = "^1.0"
pyyaml = "^6.0"
pyarrow = "^15.0"
pyspark = "^3.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.1,<10.0.0)",
    "black (>=25.11.0,<26.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "matplotlib (>=3.10.7,<4.0.0)"
]
